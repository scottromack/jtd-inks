{% if site.search.button %}
<button id="search-button" class="search-button" aria-label="Focus on search">
  <svg viewBox="0 0 24 24" class="icon size-4" aria-hidden="true"><use xlink:href="#svg-search"></use></svg>
</button>
{% endif %}

<div class="search-overlay fixed inset-0 z-40 hidden bg-gray-500/20 opacity-0 transition-[opacity,display] transition-discrete duration-200 [.search-active_&]:block [.search-active_&]:opacity-100 [.search-active_&]:starting:opacity-0"></div>
