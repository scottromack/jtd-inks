{% capture search_placeholder %}{% include search_placeholder_custom.html %}{% endcapture %}

<div class="search relative flex-1" role="search">
  <div class="search-input-wrap relative">
    <input type="text" id="search-input" class="search-input block w-full rounded-lg border bg-transparent py-2 pr-3 pl-9 text-sm transition placeholder:opacity-50 focus:border-brand-600 focus:outline-none" tabindex="0" placeholder="{{ search_placeholder | strip_html | strip }}" autocomplete="off">
    <label for="search-input" class="search-label pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 opacity-50">
      <span class="sr-only">{{ search_placeholder | strip_html | strip }}</span>
      <svg viewBox="0 0 24 24" class="search-icon size-4" aria-hidden="true"><use xlink:href="#svg-search"></use></svg>
    </label>
  </div>
  <div id="search-results" class="search-results absolute inset-x-0 top-full z-50 mt-2 hidden max-h-[70vh] -translate-y-1 overflow-y-auto rounded-lg border bg-white p-1 text-sm opacity-0 shadow-lg transition-[opacity,translate,display] transition-discrete duration-200 [.search-active_&]:block [.search-active_&]:translate-y-0 [.search-active_&]:opacity-100 [.search-active_&]:starting:-translate-y-1 [.search-active_&]:starting:opacity-0 [&_.search-result]:block [&_.search-result]:rounded-lg [&_.search-result]:px-3 [&_.search-result]:py-2 [&_.search-result:hover]:bg-gray-500/20 [&_.search-result.active]:bg-gray-500/20 [&_.search-result-title]:font-medium [&_.search-result-doc]:flex [&_.search-result-doc]:items-center [&_.search-result-doc]:gap-2 [&_.search-result-section]:mt-0.5 [&_.search-result-section]:text-xs [&_.search-result-section]:opacity-60 [&_.search-result-previews]:mt-1 [&_.search-result-previews]:text-xs [&_.search-result-previews]:opacity-60 [&_.search-result-rel-url]:mt-1 [&_.search-result-rel-url]:block [&_.search-result-rel-url]:text-xs [&_.search-result-rel-url]:opacity-40 [&_.search-result-highlight]:font-semibold [&_.search-result-highlight]:opacity-100 [&_.search-no-result]:p-3 [&_.search-no-result]:opacity-60"></div>
</div>
